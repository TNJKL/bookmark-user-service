version: '3.7'

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  user_service:
    image: user_service:dev
    build: .
    container_name: user_service
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./private.pem:/app/private.pem:ro
      - ./public.pem:/app/public.pem:ro
    depends_on:
      redis:
       condition: service_started
      postgres:
       condition: service_healthy

  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER:  ${DB_USER}
      POSTGRES_PASSWORD:  ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - /.tmp:/var/lib/postgresql/data:Z

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5



